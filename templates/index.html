<!DOCTYPE html>
<html>
<head>
    <title>Smart Hospital Finder</title>

    <link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <link rel="stylesheet"
      href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f6f8;
        }

        h2 {
            text-align: center;
            padding: 15px;
            background: #2c3e50;
            color: white;
            margin: 0;
        }

        .controls {
            padding: 15px;
            text-align: center;
        }

        .category-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .category-btn {
            padding: 8px 14px;
            border-radius: 20px;
            border: none;
            background: #ddd;
            cursor: pointer;
            transition: 0.3s;
        }

        .category-btn:hover {
            background: #bbb;
        }

        .active {
            background: #3498db;
            color: white;
        }

        .main-btn {
            padding: 10px 20px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .layout {
            display: flex;
            gap: 15px;
            padding: 15px;
        }

        #hospital-list {
            width: 280px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            overflow-y: auto;
            max-height: 500px;
        }

        .list-item {
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: #ecf0f1;
            cursor: pointer;
        }

        .list-item:hover {
            background: #d0d7de;
        }

        #map {
            height: 500px;
            flex: 1;
            border-radius: 8px;
        }

        .selected-text {
            margin-top: 5px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>

<h2>🏥 Smart Hospital Finder</h2>

<div class="controls">

    <div class="category-container">
        <button class="category-btn" onclick="setCategory(this, 'hospital')">General</button>
        <button class="category-btn" onclick="setCategory(this, 'maternity')">Maternity</button>
        <button class="category-btn" onclick="setCategory(this, 'dentist')">Dentist</button>
        <button class="category-btn" onclick="setCategory(this, 'cardiology')">Cardiologist</button>
        <button class="category-btn" onclick="setCategory(this, 'pediatric')">Pediatrician</button>
        <button class="category-btn" onclick="setCategory(this, 'neurology')">Neurologist</button>
        <button class="category-btn" onclick="setCategory(this, 'psychology')">Psychologist</button>
        <button class="category-btn" onclick="setCategory(this, 'orthopedic')">Orthopedic</button>
        <button class="category-btn" onclick="setCategory(this, 'emergency')">Accident</button>
    </div>

    <button class="main-btn" onclick="findHospital()">Find Nearest</button>

    <div class="selected-text" id="selectedText">No category selected</div>

</div>

<div class="layout">
    <div id="hospital-list">
        <b>Top Hospitals</b>
        <hr>
        <div id="list-content"></div>
    </div>

    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

<script>
let selectedCategory = null;
let map, userMarker;
let hospitalMarkers = [];
let routingControl = null;

function setCategory(button, category) {
    selectedCategory = category;

    document.querySelectorAll(".category-btn").forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");

    document.getElementById("selectedText").innerText =
        "Selected: " + category;
}

function findHospital() {

    navigator.geolocation.getCurrentPosition(position => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        fetch("/find-hospital", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ lat, lon, category: selectedCategory })
        })
        .then(res => res.json())
        .then(data => {

            if (!data.hospitals || data.hospitals.length === 0) {
                alert("No hospitals found");
                return;
            }

            showMap(lat, lon, data.hospitals);

            if (data.best_hospital) {
                showRoute(lat, lon, data.best_hospital.lat, data.best_hospital.lon);
            }
        });

    });
}

function showMap(userLat, userLon, hospitals) {

    if (!map) {
        map = L.map("map").setView([userLat, userLon], 14);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
    }

    hospitalMarkers.forEach(m => map.removeLayer(m));
    hospitalMarkers = [];

    if (userMarker) map.removeLayer(userMarker);
    if (routingControl) map.removeControl(routingControl);

    userMarker = L.marker([userLat, userLon]).addTo(map);

    const listDiv = document.getElementById("list-content");
    listDiv.innerHTML = "";

    hospitals.forEach((hospital, index) => {

        const marker = L.marker([hospital.lat, hospital.lon]).addTo(map);

        marker.on("click", function () {

            showRoute(userLat, userLon, hospital.lat, hospital.lon);

            // ✅ DIRECT NAVIGATION (NO POPUP ISSUES)
            const confirmNav = confirm(
                `Navigate to ${hospital.name}?\nDistance: ${hospital.distance} km`
            );

            if (confirmNav) {
                const url = `https://www.google.com/maps/dir/?api=1&destination=${hospital.lat},${hospital.lon}&travelmode=driving`;
                window.open(url, "_blank");
            }
        });

        if (index < 10) {
            const item = document.createElement("div");
            item.className = "list-item";
            item.innerHTML = `<b>${hospital.name}</b><br>${hospital.distance} km`;

            item.onclick = () => {
                map.setView([hospital.lat, hospital.lon], 16);
                showRoute(userLat, userLon, hospital.lat, hospital.lon);

                const confirmNav = confirm(
                    `Navigate to ${hospital.name}?\nDistance: ${hospital.distance} km`
                );

                if (confirmNav) {
                    const url = `https://www.google.com/maps/dir/?api=1&destination=${hospital.lat},${hospital.lon}&travelmode=driving`;
                    window.open(url, "_blank");
                }
            };

            listDiv.appendChild(item);
        }

        hospitalMarkers.push(marker);
    });
}

function showRoute(userLat, userLon, hLat, hLon) {

    if (routingControl) map.removeControl(routingControl);

    routingControl = L.Routing.control({
        waypoints: [
            L.latLng(userLat, userLon),
            L.latLng(hLat, hLon)
        ],
        addWaypoints: false,
        draggableWaypoints: false,
        show: false
    }).addTo(map);
}
</script>

</body>
</html>
